<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livros - Releitura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link href="layout.css" rel="stylesheet">
</head>
<body>

  <main>
    <h2 class="h4 mb-3">Livros</h2>

    <label for="busca" class="visually-hidden">Buscar livro pelo título ou autor</label>
    <input type="search" id="busca" class="form-control rounded-pill mb-3" style="max-width: 600px" placeholder="Buscar por título ou autor">

    <div id="mensagem" class="d-none" role="alert"></div>
    <div id="aviso" class="d-none" role="alert"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th scope="col">Título</th>
            <th scope="col">Ano</th>
            <th scope="col">Autor</th>
            <th scope="col">Nº de Páginas</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
    </div>
  </main>

  <script src="layout.js"></script>
  <script src="api.js"></script>
  <script src="livros.js"></script>
</body>
</html>
