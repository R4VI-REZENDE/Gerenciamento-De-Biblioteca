<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revistas - Releitura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="layout.css" rel="stylesheet">
</head>
<body class="body2">

  <main>
    <h2 class="h4 mb-3">Revistas</h2>

    <label for="busca" class="visually-hidden">Buscar revista pelo título</label>
    <input type="search" id="busca" class="form-control rounded-pill mb-3" style="max-width: 600px" placeholder="Buscar">

    <div id="aviso" class="d-none" role="alert"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th scope="col">Título</th>
            <th scope="col">Ano</th>
            <th scope="col">Edição</th>
            <th scope="col">Mês</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
    </div>
  </main>

  <script src="layout.js"></script>
  <script src="api.js"></script>
  <script src="revistas.js"></script>
</body>
</html>
