<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro - Releitura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link href="css/layout.css" rel="stylesheet">
</head>
<body>

  <main>
    <h2 class="h4 mb-3">Cadastro de material</h2>

    <div id="mensagem" class="d-none" role="alert"></div>

    <form id="form-cadastro" class="row g-3" style="max-width: 600px" novalidate>
      <div class="col-12">
        <label for="tipo" class="form-label">Tipo</label>
        <select id="tipo" class="form-select">
          <option value="livro">Livro</option>
          <option value="revista">Revista</option>
        </select>
      </div>

      <div class="col-12 col-md-8">
        <label for="titulo" class="form-label">Título</label>
        <input type="text" id="titulo" class="form-control">
      </div>
      <div class="col-12 col-md-4">
        <label for="ano" class="form-label">Ano de publicação</label>
        <input type="number" id="ano" class="form-control">
      </div>

      <!-- campos de livro -->
      <div id="grupo-livro" class="row g-3 m-0 p-0">
        <div class="col-12 col-md-8">
          <label for="autor" class="form-label">Autor</label>
          <input type="text" id="autor" class="form-control">
        </div>
        <div class="col-12 col-md-4">
          <label for="paginas" class="form-label">Páginas</label>
          <input type="number" id="paginas" class="form-control" min="1">
        </div>
      </div>

      <!-- campos de revista -->
      <div id="grupo-revista" class="row g-3 m-0 p-0 d-none">
        <div class="col-12 col-md-6">
          <label for="edicao" class="form-label">Número da edição</label>
          <input type="number" id="edicao" class="form-control" min="1">
        </div>
        <div class="col-12 col-md-6">
          <label for="mes" class="form-label">Mês (1 a 12)</label>
          <input type="number" id="mes" class="form-control" min="1" max="12">
        </div>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-dark">Cadastrar</button>
      </div>
    </form>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
