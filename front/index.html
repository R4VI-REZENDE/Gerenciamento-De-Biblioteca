<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link href="assets/style.css" rel="stylesheet">
    <link href="layout.css" rel="stylesheet">
</head>
<body class="d-flex flex-column vh-100 data-sem-menu"> 
    <main class="container flex-grow-1 overflow-auto d-flex flex-column">
        <section>
            <div class="container mt-5 text-center">
                Clique em "Livros" para gerenciar os livros cadastrados, "Revistas" 
                para gerenciar as revistas cadastradas ou "Cadastrar Item" para 
                adicionar um novo item à biblioteca.
            </div>
        </section>
        <section class="opções">
            <div class="container mt-3 align-items-center d-flex justify-content-center gap-5 mt-5">
                <button type="button" class="btn btn-success w-auto btn1" id="livros">Livros</button>
                <button type="button" class="btn btn-success w-auto btn2" id="revistas">Revistas</button>
                <button type="button" class="btn btn-success w-auto btn3" id="cadastrar">Cadastrar Item</button>
            </div>
        </section>
        <div class="container text-center mt-5 bg-dark text-white w-25 py-4 border rounded-4 mt-auto mb-5">
            <span id="item-count">0</span> Itens Cadastrados
        </div>
    </main>
    <script src="api.js"></script>
    <script src="script.js"></script>
    <script src="layout.js"></script>
    <script src="contador.js"></script>
</body>
</html>
